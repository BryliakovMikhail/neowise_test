<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #status { padding: .5rem .75rem; border-radius: .25rem; }
    #status:empty { display: none; }
    #status[data-kind="ready"] { background: #eef6ee; }
    #status[data-kind="manual"], #status[data-kind="error"] { background: #fdf1e7; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="ready" hidden>
    <p>Тема: <strong id="topic"></strong></p>
    <label for="draft">Черновик ответа</label>
    <textarea id="draft" rows="5"></textarea>
  </div>
  <script type="module">
    import { toView } from "/view.mjs";

    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const ready = document.querySelector("#ready");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    let lastRequest = 0;

    function render(view) {
      status.textContent = view.message;
      status.dataset.kind = view.kind;
      topic.textContent = view.topic;
      draft.value = view.draft;
      ready.hidden = view.kind !== "ready";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const requestId = ++lastRequest;
      // Clear the previous result right away, so an old draft is never shown for a new request.
      render({ kind: "pending", message: "Разбираем заявку…", topic: "", draft: "" });

      let view;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
        });
        view = toView(reply.status, await reply.json());
      } catch {
        view = toView(0, null);
      }
      // A slower reply to an earlier request must not overwrite the latest one.
      if (requestId === lastRequest) render(view);
    });
  </script>
</body>
</html>
